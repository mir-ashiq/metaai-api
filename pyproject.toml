[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metaai-sdk"
version = "3.0.0"
description = "Unofficial Python SDK and API server for Meta AI — image generation, chat, and more"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "metaai-api contributors"},
]
keywords = ["meta-ai", "metaai", "image-generation", "llama", "api", "sdk", "reverse-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28",
    "websockets>=10.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn[standard]>=0.20", "pydantic>=2.0"]
browser = ["agent-browser>=0.30"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "black", "flake8"]

[project.scripts]
metaai-server = "metaai_api.api_server:main"

[project.urls]
"Homepage" = "https://github.com/mir-ashiq/metaai-api"
"Repository" = "https://github.com/mir-ashiq/metaai-api"
"Issues" = "https://github.com/mir-ashiq/metaai-api/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metaai_api = ["py.typed"]
